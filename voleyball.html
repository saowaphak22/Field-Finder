<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>เลือกสนามวอลเลย์บอล</title>

<style>
body {
  font-family: Segoe UI;
    background:
      linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
      url(https://images.unsplash.com/photo-1666901356149-93f2eb3ba5a2?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D);
    background-size: cover;
    background-position: center;
  margin: 0;
  padding: 0;
  min-height: 100vh;
}

h1 {
  text-align: center;
  padding: 30px;
  font-size: 30px;
  color: white;
}

.field-box {
  width: 600px;
  margin: 20px auto;
  padding: 25px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.2);
  box-shadow: 0 8px 20px rgba(0,0,0,1.5);
  text-align: left;
  transition: 0.3s ease;
  color: white;
}

button {
  background: #0a0fbd;
  color: white;
  padding: 10px 20px;
  border: none;
  border-radius: 25px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
  transition: all 0.3s ease;
}

button:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(0,255,100,0.6);
  background: #e8e811;
  color: white;
}

button:active {
  transform: scale(0.95);
}
.status {
    font-weight: bold;
    margin: 8px 0;
}

.available {
    color: #00ff88;
}

.unavailable {
    color: #ff4d4d;
}

.maintenance {
    color: #ffd700;
}

</style>
</head>

<body>

<h1>เลือกสนามวอลเลเย์บอล</h1>

<div class="field-box">
  <h3>สนามวอลเลย์บอล (ยิมวอลเลย์บอล)</h3>
  <p class="status available">สถานะ: พร้อมใช้งาน</p>
  <button>จองสนาม</button>
</div>

<div class="field-box">
  <h3>สนามวอลเลย์บอล (โดมฟ้า)</h3>
  <p class="status available">สถานะ: พร้อมใช้งาน</p>
  <button>จองสนาม</button>
</div>

</body>
</html>
