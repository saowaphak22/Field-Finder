<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เลือกสระว่ายน้ำ</title>
<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #87f7e8;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    margin: 0;
    padding: 0;
    height: 100%;
    min-height: 100vh;
}
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
}
.container {
    position: relative;
    padding: 50px 20px;
    text-align: center;
}
h1 {
    color: white;
    margin-bottom: 40px;
    font-size: clamp(16px, 4vw, 24px);
    letter-spacing: 1px;
}
.court-box {
    width: 600px;
    margin: 20px auto;
    padding: 25px;
    border-radius: 18px;
    backdrop-filter: blur(15px);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    text-align: left;
    transition: 0.3s ease;
}
.court-title {
    color: white;
    font-size: 20px;
    margin-bottom: 8px;
}
button:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(0,255,100,0.6);
  background: white;
  color: #38f0e4;
}
.status {
    font-weight: bold;
}
.status {
    font-weight: bold;
    margin: 8px 0;
}
.available {
    color: #00ff88;
}
.unavailable {
    color: #ff4d4d;
}
.maintenance {
    color: #ffd700;
}
.btn-book {
    margin-top: 15px;
    padding: 10px 20px;
    border: none;
    border-radius: 25px;
    background: #38f0e4;
    color: white;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

.btn-book:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(255,140,0,0.8);
}
</style>
</head>

<body>

<div class="container">
    <h1>เลือกสระว่ายน้ำ</h1>

    <div class="court-box">
        <div class="court-title">สระว่ายน้ำ 25 เมตร (มกช.สุโขทัย)</div>
        <div class="status available">สถานะ: พร้อมใช้งาน</div>
        <button class="btn-book">จองสนาม</button>
    </div>

    <div class="court-box">
        <div class="court-title">สระว่ายน้ำ 50 เมตร (มกช.สุโขทัย)</div>
        <div class="status available">สถานะ: พร้อมใช้งาน</div>
        <button class="btn-book">จองสนาม</button>
    </div>

</div>

</body>
</html>
